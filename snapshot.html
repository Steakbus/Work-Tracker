<!doctype html>
<!-- Phone snapshot. app.py fills the placeholders after every change (see write_snapshot).
     No JavaScript: file viewers (OneDrive, Outlook, Files) don't run it. Days open with <details>. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work Tracker</title>
<style>
  :root {
    --bg: #f6f8fa; --card: #fff; --border: #d0d7de; --text: #1f2328; --muted: #656d76;
    --accent: #1f883d; --danger: #cf222e;
    --l0: #ebedf0; --l1: #9be9a8; --l2: #40c463; --l3: #30a14e; --l4: #216e39;
    --vacation: #54aeff; --sick: #fb8f44; --vacation-text: #0969da; --sick-text: #bc4c00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8d96a0;
      --accent: #2ea043; --danger: #f85149;
      --l0: #21262d; --l1: #0e4429; --l2: #006d32; --l3: #26a641; --l4: #39d353;
      --vacation: #1f6feb; --sick: #db6d28; --vacation-text: #58a6ff; --sick-text: #f0883e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 16px 40px; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .stats { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-bottom: 12px; }
  .stats .card { margin: 0; }
  .label { font-size: 13px; color: var(--muted); }
  .value { font-size: 20px; font-weight: 600; margin: 2px 0 6px; }
  .pos { color: var(--accent); }
  .neg { color: var(--danger); }
  .bar { height: 6px; background: var(--l0); border-radius: 3px; overflow: hidden; }
  .bar div { height: 100%; background: var(--accent); }

  .week { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) auto; gap: 8px 10px; align-items: center; }
  .week .today { font-weight: 600; }

  .heat { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; }
  .heat span { aspect-ratio: 1; border-radius: 2px; background: var(--l0); }
  .heat .none { background: transparent; }
  .heat .l1 { background: var(--l1); } .heat .l2 { background: var(--l2); }
  .heat .l3 { background: var(--l3); } .heat .l4 { background: var(--l4); }
  .heat .vacation { background: var(--vacation); } .heat .sick { background: var(--sick); }
  .vacation-text { color: var(--vacation-text); } .sick-text { color: var(--sick-text); }
  .legend { display: flex; gap: 3px; align-items: center; justify-content: flex-end; margin-top: 8px; }
  .legend span { width: 10px; height: 10px; border-radius: 2px; }

  details.month { border-top: 1px solid var(--border); }
  details.month:first-of-type { border-top: 0; }
  details.month > summary { padding: 10px 0; font-weight: 600; }
  summary { cursor: pointer; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "›"; float: right; color: var(--muted); transition: transform .15s; }
  details[open] > summary::after { transform: rotate(90deg); }
  .day > summary { display: grid; grid-template-columns: 1fr auto 5.2em 1em; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); }
  .day > summary::after { float: none; text-align: right; }
  .day .delta { text-align: right; }
  .sessions { margin: 0 0 10px; padding: 0; list-style: none; }
  .sessions li { padding: 6px 10px; margin-top: 4px; background: var(--bg); border-radius: 8px; }
  .sessions .note { display: block; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Work Tracker</h1>
    <span class="muted small">Updated $updated</span>
  </header>

  <section class="stats">
    <div class="card">
      <div class="label">Today</div>
      <div class="value">$today <span class="muted small">/ $today_target</span></div>
      <div class="bar"><div style="width: $today_pct%"></div></div>
    </div>
    <div class="card">
      <div class="label">This week</div>
      <div class="value">$week <span class="muted small">/ $week_target</span></div>
      <div class="bar"><div style="width: $week_pct%"></div></div>
    </div>
    <div class="card">
      <div class="label">Overtime</div>
      <div class="value $balance_class">$balance</div>
      <div class="muted small">before today</div>
    </div>
    <div class="card">
      <div class="label">Overtime incl. today</div>
      <div class="value $balance_today_class">$balance_today</div>
      <div class="muted small">if you stopped now</div>
    </div>
  </section>

  <section class="card">
    <h2>This week</h2>
    <div class="week">$week_rows</div>
  </section>

  <section class="card">
    <h2>Last 6 months</h2>
    <div class="heat" style="grid-template-rows: repeat($heat_rows, 1fr)">$heat</div>
    <div class="legend muted small">less <span style="background: var(--l0)"></span><span style="background: var(--l1)"></span><span style="background: var(--l2)"></span><span style="background: var(--l3)"></span><span style="background: var(--l4)"></span> more
      &nbsp; <span style="background: var(--vacation)"></span> vacation &nbsp; <span style="background: var(--sick)"></span> sick</div>
  </section>

  <section class="card">
    <h2>Days</h2>
    $months
  </section>
</main>
</body>
</html>
